<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Log | Your Name</title>
  <meta name="description" content="Every esports broadcast I've cast: role, game, event, date, length and VOD.">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="streams.css">
</head>

<body>

  <!-- ===== NAVIGATION (same links as index.html) ===== -->
  <header>
    <nav>
      <a class="logo" href="index.html">YourName<span style="color: var(--accent);">.</span></a>
      <ul>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#projects">Projects</a></li>
        <li><a href="index.html#casting">Casting</a></li>
        <li><a href="streams.html" aria-current="page">Streams</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <div class="container">
        <p class="tag">Esports Casting</p>
        <h1>Stream log</h1>
        <p class="section-intro">Every broadcast I've worked on, with the role, game, event, date, length and VOD.</p>
      </div>
    </div>

    <section style="padding-top: 24px;">
      <div class="container">

        <div class="stream-controls">
          <label>Role
            <select id="filter-role"><option value="">All roles</option></select>
          </label>
          <label>Game
            <select id="filter-game"><option value="">All games</option></select>
          </label>
          <label>Event
            <select id="filter-event"><option value="">All events</option></select>
          </label>
          <label>Sort by
            <select id="sort-streams">
              <option value="date-desc">Newest first</option>
              <option value="date-asc">Oldest first</option>
              <option value="length-desc">Longest first</option>
              <option value="game-asc">Game (A–Z)</option>
            </select>
          </label>
        </div>

        <p id="stream-count" class="stream-count" aria-live="polite"></p>
        <div id="stream-grid" class="stream-grid"></div>
        <p id="streams-status" class="streams-status" role="status" aria-live="polite"></p>

      </div>
    </section>
  </main>

  <footer>
    &copy; <span id="year"></span> Your Name. Built with HTML &amp; CSS.
  </footer>

  <script src="streams.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
